
<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>कथा सागर | Katha Sagar</title>

<style>
*{
 margin:0;
 padding:0;
 box-sizing:border-box;
}
body{
 font-family:'Noto Sans Devanagari',Arial,sans-serif;
 background:#f8f7f3;
 color:#222;
 overflow-x:hidden;
}

/* HEADER */
.header{
 height:75px;
 background:linear-gradient(120deg,#102c60,#174c91);
 color:white;
 display:flex;
 align-items:center;
 justify-content:space-between;
 padding:0 20px;
 position:sticky;
 top:0;
 z-index:100;
 box-shadow:0 3px 12px #0003;
}
.brand{
 font-size:25px;
 font-weight:bold;
 letter-spacing:1px;
}
.header-right{
 display:flex;
 gap:22px;
 align-items:center;
}
.icon-btn{
 background:none;
 border:0;
 color:white;
 font-size:27px;
 cursor:pointer;
}

/* SIDEBAR */
.sidebar{
 position:fixed;
 top:75px;
 left:0;
 bottom:0;
 width:290px;
 max-width:82%;
 background:#fff;
 z-index:90;
 transform:translateX(-105%);
 transition:transform .4s ease;
 box-shadow:5px 0 20px #0002;
 overflow-y:auto;
}
.sidebar.open{
 transform:translateX(0);
}
.side-title{
 background:#153b76;
 color:white;
 padding:23px 20px;
 font-size:21px;
}
.menu-item{
 display:flex;
 align-items:center;
 gap:15px;
 padding:17px 20px;
 color:#253b60;
 font-size:16px;
 border-bottom:1px solid #eee;
 text-decoration:none;
 cursor:pointer;
 transition:.2s;
}
.menu-item:hover{
 background:#edf3fc;
 color:#bc7c20;
 padding-left:27px;
}
.menu-item span{
 font-size:21px;
 width:27px;
}
.overlay{
 position:fixed;
 inset:75px 0 0;
 background:#0006;
 z-index:80;
 display:none;
}
.overlay.show{
 display:block;
}

/* SEARCH */
.search-box{
 display:none;
 background:white;
 padding:12px 18px;
}
.search-box.show{display:block}
.search-box input{
 width:100%;
 padding:13px;
 border:1px solid #ccc;
 border-radius:30px;
 outline:none;
 font-size:16px;
}

/* HERO */
.hero{
 width:100%;
 height:calc(100vh - 75px);
 min-height:400px;
 overflow:hidden;
 background:#142e57;
}
.hero img{
 width:100%;
 height:100%;
 object-fit:cover;
 object-position:center;
 display:block;
}

/* CONTENT */
.content{
 display:none;
 padding:25px 18px 100px;
 min-height:70vh;
}
.content h2{
 color:#173d78;
 margin-bottom:20px;
 font-size:24px;
}
.content-item{
 padding:17px;
 margin-bottom:12px;
 background:white;
 border-left:4px solid #c49a43;
 box-shadow:0 2px 8px #0001;
 border-radius:5px;
 cursor:pointer;
 font-size:17px;
}
.content-item:hover{
 background:#edf3fc;
}
.back-btn{
 padding:10px 18px;
 border:0;
 background:#173d78;
 color:white;
 border-radius:25px;
 margin-bottom:20px;
 cursor:pointer;
}
.article{
 background:white;
 padding:20px;
 line-height:2;
 border-radius:8px;
}
.article h3{color:#173d78;margin-bottom:15px}

/* FOOTER */
footer{
 background:#102c60;
 color:white;
 padding:20px;
 text-align:center;
 font-size:13px;
}
@media(min-width:768px){
 .hero{
  height:calc(100vh - 75px);
 }
 .hero img{
  object-fit:contain;
 }
}
</style>
</head>

<body>

<!-- HEADER -->
<header class="header">
 <div class="header-right">
  <button class="icon-btn" onclick="toggleMenu()">☰</button>
  <div class="brand">॥ कथा सागर ॥</div>
 </div>

 <div class="header-right">
  <button class="icon-btn" onclick="toggleSearch()">⌕</button>
 </div>
</header>

<!-- SEARCH -->
<div class="search-box" id="searchBox">
 <input type="search" id="searchInput"
 placeholder="कथा, व्रत, मंत्र खोजें..."
 oninput="searchItems()">
</div>

<!-- SIDEBAR -->
<aside class="sidebar" id="sidebar">
 <div class="side-title">॥ कथा सागर ॥</div>

 <a class="menu-item" onclick="showHome()">
 <span>⌂</span> मुख्य पृष्ठ
 </a>

 <a class="menu-item" onclick="openSection('katha')">
 <span>📖</span> कथा संग्रह
 </a>

 <a class="menu-item" onclick="openSection('puran')">
 <span>🪔</span> पौराणिक कथाएँ
 </a>

 <a class="menu-item" onclick="openSection('vrat')">
 <span>🙏</span> व्रत एवं त्योहार
 </a>

 <a class="menu-item" onclick="openSection('mantra')">
 <span>📿</span> मंत्र संग्रह
 </a>

 <a class="menu-item" onclick="openSection('sahastra')">
 <span>🕉</span> सहस्त्रनामावली
 </a>

 <a class="menu-item" onclick="openSection('bhajan')">
 <span>🎵</span> भजन संग्रह
 </a>

 <a class="menu-item" onclick="openSection('pooja')">
 <span>🌺</span> पूजन विधि
 </a>

 <a class="menu-item" onclick="openSection('about')">
 <span>ℹ</span> हमारे बारे में
 </a>
</aside>

<div class="overlay" id="overlay" onclick="toggleMenu()"></div>

<!-- HOME: ONLY IMAGE -->
<main>
 <section class="hero" id="home">
  <img src="bhagwan.jpg" alt="भगवान का दिव्य स्वरूप">
 </section>

 <!-- CONTENT -->
 <section class="content" id="content">
  <button class="back-btn" onclick="showHome()">← वापस जाएँ</button>
  <h2 id="sectionTitle"></h2>
  <div id="items"></div>
 </section>
</main>

<footer>
 ॥ जय श्री हरि ॥ <br>
 © 2026 कथा सागर
</footer>

<script>

const data={
 katha:{
 title:"कथा संग्रह",
 items:["श्री सत्यनारायण भगवान की कथा","श्री विष्णु कथा","शिव महापुराण कथा","श्री राम कथा","श्री कृष्ण कथा","माता रानी की कथा"]
 },
 puran:{
 title:"पौराणिक कथाएँ",
 items:["मत्स्य अवतार की कथा","कूर्म अवतार की कथा","वराह अवतार की कथा","नरसिंह अवतार की कथा","वामन अवतार की कथा","समुद्र मंथन की कथा"]
 },
 vrat:{
 title:"व्रत एवं त्योहार",
 items:["एकादशी व्रत कथा","प्रदोष व्रत कथा","सोमवार व्रत कथा","करवा चौथ व्रत","नवरात्रि व्रत","जन्माष्टमी व्रत"]
 },
 mantra:{
 title:"मंत्र संग्रह",
 items:["श्री विष्णु मंत्र","महामृत्युंजय मंत्र","गायत्री मंत्र","शिव पंचाक्षर मंत्र","श्री राम मंत्र"]
 },
 sahastra:{
 title:"सहस्त्रनामावली",
 items:["श्री विष्णु सहस्रनाम","श्री शिव सहस्रनाम","श्री ललिता सहस्रनाम","श्री गणेश सहस्रनाम"]
 },
 bhajan:{
 title:"भजन संग्रह",
 items:["श्री हरि विष्णु भजन","शिव भजन","श्री राम भजन","श्री कृष्ण भजन","हनुमान भजन"]
 },
 pooja:{
 title:"पूजन विधि",
 items:["श्री विष्णु पूजन विधि","शिव पूजन विधि","गणेश पूजन विधि","लक्ष्मी पूजन विधि","सत्यनारायण पूजा विधि"]
 },
 about:{
 title:"हमारे बारे में",
 items:["कथा सागर में आपका स्वागत है। यहाँ धार्मिक कथाएँ, मंत्र, व्रत और भजन पढ़ने के लिए उपलब्ध होंगे।"]
 }
};

function toggleMenu(){
 document.getElementById('sidebar').classList.toggle('open');
 document.getElementById('overlay').classList.toggle('show');
}

function closeMenu(){
 document.getElementById('sidebar').classList.remove('open');
 document.getElementById('overlay').classList.remove('show');
}

function toggleSearch(){
 document.getElementById('searchBox').classList.toggle('show');
}

function openSection(key){
 closeMenu();

 const section=data[key];
 document.getElementById('home').style.display='none';
 document.getElementById('content').style.display='block';

 document.getElementById('sectionTitle').innerText=section.title;

 const container=document.getElementById('items');
 container.innerHTML='';

 section.items.forEach((item)=>{
  const div=document.createElement('div');
  div.className='content-item';
  div.innerText='❖  '+item;
  div.onclick=()=>openArticle(item);
  container.appendChild(div);
 });

 window.scrollTo({top:0,behavior:'smooth'});
}

function openArticle(name){
 const container=document.getElementById('items');
 container.innerHTML=`
 <div class="article">
 <h3>${name}</h3>
 <p>॥ श्री गणेशाय नमः ॥</p>
 <p>${name} का संपूर्ण विवरण यहाँ पढ़ें।</p>
 <p>इस स्थान पर संबंधित कथा, मंत्र अथवा पूजन विधि का पूरा पाठ जोड़ा जा सकता है।</p>
 </div>
 `;
}

function showHome(){
 closeMenu();
 document.getElementById('content').style.display='none';
 document.getElementById('home').style.display='block';
 window.scrollTo({top:0,behavior:'smooth'});
}

function searchItems(){
 const value=document.getElementById('searchInput').value.trim().toLowerCase();
 document.getElementById('home').style.display='none';
 document.getElementById('content').style.display='block';
 document.getElementById('sectionTitle').innerText='खोज परिणाम';

 const container=document.getElementById('items');
 container.innerHTML='';

 Object.values(data).forEach(section=>{
  section.items.forEach(item=>{
   if(item.toLowerCase().includes(value) && value){
    const div=document.createElement('div');
    div.className='content-item';
    div.innerText='❖  '+item;
    container.appendChild(div);
   }
  });
 });

 if(!container.innerHTML){
  container.innerText=value?'कोई परिणाम नहीं मिला।':'खोजने के लिए शब्द लिखें।';
 }
}
</script>

</body>
</html>
